name: mint guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Installing explicitly is more predictable than npx resolution in CI.
      - name: Install mint
        run: npm install --no-save --no-package-lock --omit=dev @xnah/mint

      - name: mint guard scan
        run: ./node_modules/.bin/mint guard scan --fail-on high --format sarif > mintguard.sarif

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: mintguard.sarif
          category: mint-guard
